name: Validate Vulkan EGL runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulkan-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build the Vulkan runtime
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: .devops/main-vulkan.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: whisper-vulkan:egl-test
      - name: Verify EGL library and server startup
        run: |
          docker run --rm --entrypoint /bin/sh whisper-vulkan:egl-test -ec '
            test "$(dpkg-query -W -f="\${Status}" libegl1)" = "install ok installed"
            ldconfig -p | grep -F "libEGL.so.1"
            whisper-server --help
          '
